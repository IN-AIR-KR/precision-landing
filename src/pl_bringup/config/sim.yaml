detection:
  aruco_id: 0
  dictionary: 2
  marker_size: 1.0
  debug_fps: 15.0
  jpeg_quality: 80
control:
  align:
    position_tolerance_m: 0.2
    relative_speed_tolerance_mps: 0.2
  approach:
    descent_speed_mps: 0.6
  horizontal_tracking:
    velocity_p_gain: 1.7
    velocity_i_gain: 0.0
    max_speed_mps: 10.0
  target_estimation:
    timeout_s: 5.0
    acceleration_noise_mps2: 1.0
    position_noise_m: 0.1
  camera_extrinsic:
    # Optical frame -> body FRD. Positive z points down.
    # Preserve the existing SITL camera offset.
    position: [0.0, 0.0, -0.10] # [x, y, z] in meters
    rotation: [0.7071067811865476, 0.0, 0.0, 0.7071067811865476] # [w, x, y, z], image top points forward
px4:
  udp:
    port: 8888
viz:
  transport: raw
  fps: 10.0
  jpeg_quality: 80
  stale_after: 2.0
  gazebo: true
