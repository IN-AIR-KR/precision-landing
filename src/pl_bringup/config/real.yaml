camera:
  driver: imx708_camera
  sensor_mode: 1
  width: 1536
  height: 864
  fps: 60.0
  output_width: 640
  output_height: 360
  calibration:
    image_width: 1536
    image_height: 864
    camera_matrix:
      data: [1722.1254727553342, 0.0, 777.0401534625447, 0.0, 1725.6092277158423, 445.24568830173376, 0.0, 0.0, 1.0]
    distortion_coefficients:
      data: [-0.02273058199375585, 0.36348330313082333, 0.0015919557035609802, 0.0027426564643056477, -0.8841877125217799]
detection:
  aruco_id: 0
  dictionary: 2
  marker_size: 0.15
  debug_fps: 60.0 # Keep each frame from the 30 Hz camera available to the HUD.
  debug_max_width: 640
  jpeg_quality: 80
control:
  align:
    position_tolerance_m: 0.2
    relative_speed_tolerance_mps: 0.2
  approach:
    descent_speed_mps: 0.6
  horizontal_tracking:
    velocity_p_gain: 0.1
    velocity_i_gain: 0.0
    velocity_d_gain: 0.0
    max_speed_mps: 10.0
  target_estimation:
    timeout_s: 3.0
    acceleration_noise_mps2: 1.0
    position_noise_m: 0.1
  camera_extrinsic:
    # Optical frame -> body FRD. Positive z points down.
    # 기체 중심에서 아래로 10 cm, 영상 위쪽이 기체 앞을 향하는 하방 카메라
    position: [0.0, 0.0, 0.10] # [x, y, z] in meters
    rotation: [0.7071067811865476, 0.0, 0.0, 0.7071067811865476] # [w, x, y, z], image top points forward
px4:
  domain_id: 0 # Match PX4 UXRCE_DDS_DOM_ID.
  uart:
    device: /dev/ttyTHS1
    baud: 921600 # Match PX4 SER_TEL2_BAUD.
viz:
  transport: raw
  fps: 30.0
  jpeg_quality: 45
  max_width: 640
  stale_after: 2.0
mpc:
  # Required by real_mpc.launch.py. Use values for this airframe and payload.
  hover_thrust: null
  px4_thrust_model_factor: null
  measured_motor_thrust_model_factor: null
  land_detector_z_velocity_max: null
  approach_descent_speed: null
