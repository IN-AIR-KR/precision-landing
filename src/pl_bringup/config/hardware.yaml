# Optical frame: x right, y down, z forward. Camera transform maps optical to body FRD.
# Hardware values are unverified placeholders until CSI commissioning.
camera:
  image_topic: /camera/image_raw
  camera_info_topic: /camera/camera_info
  calibration_verified: false
  optical_frame: camera_optical_frame
  extrinsics_verified: false
detection:
  aruco_id: 0
  dictionary: 2
  marker_size: 1.0
  debug_fps: 15.0
  jpeg_quality: 80
control:
  descent_vel: 0.6
  vel_p_gain: 1.7
  vel_i_gain: 0.0
  max_velocity: 10.0
  target_timeout: 5.0
  delta_position: 0.2
  delta_velocity: 0.2
  target_accel_noise: 1.0
  target_pos_noise: 0.1
  camera_position_body:
  - 0.0
  - 0.0
  - -0.1
  camera_orientation_body:
  - 0.7071067811865476
  - 0.0
  - 0.0
  - 0.7071067811865476
agent:
  device: /dev/ttyTHS1
  # 921600: FC 의 SER_TEL2_BAUD 와 맞춘 값. 3000000 은 아직 검증되지 않았다.
  baud: 921600
viz:
  transport: compressed
  fps: 10.0
  jpeg_quality: 80
  stale_after: 2.0
