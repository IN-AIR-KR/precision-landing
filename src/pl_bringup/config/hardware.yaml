# Stage 0 target: external Image/CameraInfo required. CSI capture is stage 1.
# Verify calibration and camera mounting on the actual airframe before enabling this profile.
camera:
  source: external
  image_topic: /camera/image_raw
  camera_info_topic: /camera/camera_info
  calibration_verified: false
detection:
  aruco_id: 0
  dictionary: 2
  marker_size: 1.0
control:
  descent_vel: 0.6
  vel_p_gain: 1.7
  vel_i_gain: 0.0
  max_velocity: 10.0
  target_timeout: 5.0
  delta_position: 0.2
  delta_velocity: 0.2
  target_accel_noise: 1.0
  target_pos_noise: 0.1
agent:
  transport: serial
  device: /dev/ttyTHS1
  baud: 3000000
viz:
  gazebo: false
bridge:
  world: hardware
  model: x500_mono_cam_down_0
